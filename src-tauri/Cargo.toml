[package]
name = "regmon"
version = "0.0.1"
description = "Native register monitor for openGear devices"
authors = ["RegMon contributors"]
edition = "2021"

[lib]
name = "regmon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serialport = "4.9"
tauri = { version = "2", features = [] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = "0.7"
